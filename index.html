<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#0EA5E9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="최선우 타자연습" />
  <title>최선우 타자연습 — 한글 · 영어 타자연습</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="./css/styles.css" />
  <script defer src="./js/data-ko.js"></script>
  <script defer src="./js/data-en.js"></script>
  <script defer src="./js/keyboard-config.js"></script>
  <script defer src="./js/ime-evaluator.js"></script>
  <script defer src="./js/mobile-viewport.js"></script>
  <script defer src="./js/profile-store.js"></script>
  <script type="module" src="./js/firebase-sync.js"></script>
  <script defer src="./js/components/keyboard-view.js"></script>
  <script defer src="./js/components/profile-modal.js"></script>
  <script defer src="./js/components/dashboard-modal.js"></script>
  <script defer src="./js/modes/position-mode.js"></script>
  <script defer src="./js/modes/text-practice-mode.js"></script>
  <script defer src="./js/modes/dictation-mode.js"></script>
  <script defer src="./js/modes/acid-rain-mode.js"></script>
  <script defer src="./js/app.js"></script>
</head>
<body>
  <header class="app-header" id="app-header">
    <div class="header-inner">
      <button type="button" class="brand-btn" id="brand-home-btn" aria-label="홈으로 이동">
        <span class="brand-icon" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <rect x="2" y="5" width="20" height="14" rx="3.5" stroke="currentColor" stroke-width="1.8" />
            <rect x="5" y="9" width="2.4" height="2.4" rx="0.7" fill="currentColor" />
            <rect x="8.8" y="9" width="2.4" height="2.4" rx="0.7" fill="currentColor" />
            <rect x="12.6" y="9" width="2.4" height="2.4" rx="0.7" fill="currentColor" />
            <rect x="16.4" y="9" width="2.6" height="2.4" rx="0.7" fill="currentColor" />
            <rect x="6.5" y="13.5" width="11" height="2.3" rx="1" fill="currentColor" />
          </svg>
        </span>
        <span class="brand-text">
          <strong class="brand-title">최선우 타자연습</strong>
          <span class="brand-sub" id="brand-sub">한·영 타자연습</span>
        </span>
      </button>

      <nav class="mode-nav" id="mode-nav" aria-label="연습 모드">
        <button type="button" class="nav-tab" data-mode="position">자리 연습</button>
        <button type="button" class="nav-tab" data-mode="word">낱말 연습</button>
        <button type="button" class="nav-tab" data-mode="short">단문장 연습</button>
        <button type="button" class="nav-tab" data-mode="long">장문장 연습</button>
        <button type="button" class="nav-tab" data-mode="dictation">받아쓰기</button>
        <button type="button" class="nav-tab nav-tab--game" data-mode="acid">산성비 게임</button>
      </nav>

      <div class="header-actions">
        <button type="button" class="header-pill-btn hidden" id="pwa-install-btn" title="홈 화면에 앱 설치">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
            <path d="M12 3v12m0 0l-4-4m4 4l4-4" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" stroke-linecap="round" />
          </svg>
          <span class="install-btn-label">앱 설치</span>
        </button>

        <button type="button" class="header-pill-btn" id="hw-kb-toggle" aria-pressed="false" title="외장(블루투스) 키보드 모드 — 모바일 터치 키보드 팝업 억제">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <rect x="2" y="6" width="20" height="12" rx="3" />
            <path d="M6 10h2m3 0h2m3 0h2M7 14h10" stroke-linecap="round" />
          </svg>
          <span class="hw-kb-label">외장키보드</span>
        </button>

        <div class="lang-toggle" id="lang-toggle" role="group" aria-label="연습 언어 선택">
          <button type="button" class="lang-btn is-active" data-lang="ko" aria-pressed="true">한글</button>
          <button type="button" class="lang-btn" data-lang="en" aria-pressed="false">영어</button>
        </div>

        <button type="button" class="profile-menu-btn" id="profile-menu-btn" aria-haspopup="dialog" title="사용자 전환 및 연습 기록 관리">
          <span class="user-avatar-sm" id="header-user-avatar">기</span>
          <span class="header-user-name" id="header-user-name">기본 사용자</span>
          <span class="grade-badge grade-badge--xs grade-tier-1" id="header-user-grade">초보자</span>
          <span class="profile-caret" aria-hidden="true">▾</span>
        </button>

        <button type="button" class="header-pill-btn dashboard-open-btn" id="dashboard-open-btn" aria-haspopup="dialog" title="전체 사용자 현황 및 등급 대시보드">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M18 20V10M12 20V4M6 20v-6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span class="dashboard-btn-label">전체 현황</span>
        </button>
      </div>
    </div>
  </header>

  <main id="app-main" class="app-main" tabindex="-1"></main>

  <div id="result-overlay" class="result-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="result-modal-title"></div>
  <div id="profile-overlay" class="profile-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="profile-modal-title"></div>
  <div id="dashboard-overlay" class="dashboard-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="dashboard-modal-title"></div>
  <div id="toast-container" class="toast-container" aria-live="polite"></div>
</body>
</html>
